<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AC &amp; Fan">
  <meta name="color-scheme" content="light dark">
  <title>Smart AC &amp; Fan Controller</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E❄%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">❄</span>
        <span class="brand-name">Smart AC &amp; Fan</span>
      </div>
      <nav class="nav" aria-label="Main">
        <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
        <a href="#/profiles" data-nav="profiles">Profiles</a>
      </nav>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <div id="miniRun" class="mini" hidden></div>

  <dialog id="editorDialog" class="dialog" aria-labelledby="editorTitle"></dialog>

  <dialog id="confirmDialog" class="dialog dialog-sm" aria-labelledby="confirmTitle">
    <form method="dialog" class="confirm">
      <h2 id="confirmTitle">Delete?</h2>
      <p id="confirmText"></p>
      <div class="dialog-actions">
        <button class="btn" value="cancel" autofocus>Cancel</button>
        <button class="btn btn-danger" value="ok">Delete</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/storage.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/runner.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
